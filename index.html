if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.wfInstall = e; });   // die App zeigt dafuer einen Knopf
function bytes(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var knopf = document.getElementById('b'), meldung = document.getElementById('m');
  knopf.disabled = true; meldung.textContent = '';
  crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('p').value), 'PBKDF2', false, ['deriveKey']).then(function (k) {
    return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(PAKET.salz), iterations: 600000 }, k, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }).then(function (k) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAKET.iv) }, k, bytes(PAKET.daten));
  }).then(function (gz) {
    return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }).then(function (html) {
    // Erfolgreiche Anmeldung dem Passwort-Manager melden, die Seite laedt ja nicht neu
    var merken = window.PasswordCredential && navigator.credentials ? navigator.credentials.store(new PasswordCredential(document.getElementById('f'))).catch(function () {}) : Promise.resolve();
    // Die Abfrage darf das Oeffnen nie blockieren
    return Promise.race([merken, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () { return html; });
  }).then(function (html) {
    document.open(); document.write(html); document.close();
  }).catch(function () {
    knopf.disabled = false; meldung.textContent = 'Passwort falsch.';
  });
});
</script>
